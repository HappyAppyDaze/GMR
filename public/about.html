<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section class="section"><div class="wrap"><h1>Biography</h1><div id="bio" class="bio"></div><h2 style="margin-top:55px">Career Stats</h2><div id="stats" class="stats"></div></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();document.querySelector('#bio').innerHTML=(d?.bio||'').split('\n').map(x=>`<p>${x}</p>`).join('');document.querySelector('#stats').innerHTML=(d?.stats||[]).map(x=>`<div class="stat"><h3>${x.year}</h3><p>${x.text}</p></div>`).join('')})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
