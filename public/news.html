<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>News | Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section id="pageHero" class="page-hero"><div class="wrap"><div class="eyebrow">Greg Marshall Racing • #95</div><h1>NEWS + SOCIAL</h1></div></section><section class="section"><div class="wrap"><p>Latest updates from Greg's Instagram plus race reports and website news.</p><div id="social" class="social-grid"></div><div id="socialNote" class="notice" style="display:none;margin-top:20px"></div><h2 style="margin-top:55px">Race Reports &amp; Website News</h2><div id="list" class="grid"></div></div></section><script>
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function niceDate(s){if(!s)return'';let d=new Date(s);return isNaN(d)?s:d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}
document.addEventListener('DOMContentLoaded',async()=>{let [d,s]=await Promise.all([content(),fetch('/api/social').then(r=>r.json()).catch(()=>({posts:[]}))]);let posts=s.posts||[];document.querySelector('#social').innerHTML=posts.map(x=>{let img=x.media_type==='VIDEO'?(x.thumbnail_url||x.media_url):x.media_url;return `<a class="social-card" href="${esc(x.permalink)}" target="_blank" rel="noopener"><img src="${esc(img||'')}" alt="Instagram post" loading="lazy"><div class="social-copy"><div class="social-meta">Instagram • ${esc(niceDate(x.posted_at))}</div><p>${esc(x.caption||'View this post on Instagram')}</p></div></a>`}).join('');if(!posts.length){let n=document.querySelector('#socialNote');n.style.display='block';n.textContent='The Instagram feed is waiting to be connected. Existing race reports are still available below.'}document.querySelector('#list').innerHTML=(d?.news||[]).map(x=>`<article class="card" id="${esc(x.id)}"><div class="pad"><small>${esc(x.date)}</small><h3>${esc(x.title)}</h3><p>${esc(x.body||'')}</p></div></article>`).join('')})</script><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();let img=d?.artwork?.news;if(img){pageHero.style.backgroundImage=`url('${img}')`}else pageHero.style.backgroundImage=`url('${A.hero||''}')`})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
