<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section id="pageHero" class="page-hero"><div class="wrap"><div class="eyebrow">Greg Marshall Racing • #95</div><h1>SPONSORS + SUPPLIERS</h1></div></section><section class="section"><div class="wrap"><div id="sp" class="sponsors"></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{content().then(d=>{let sc=d?.sponsors||{},tiles=(sc.tiles?.length?sc.tiles:(A.sponsors||[]).map(image=>({image,link:'',text:'',background:'white'}))),pc=Math.max(1,parseInt(sc.pageColumns)||3),pr=Math.max(1,parseInt(sc.pageRows)||6),el=document.querySelector('#sp');el.style.setProperty('--sponsor-cols',pc);el.innerHTML=tiles.slice(0,pc*pr).map(sponsorTile).join('')})})</script><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();let img=d?.artwork?.sponsors;if(img){pageHero.style.backgroundImage=`url('${img}')`}else pageHero.style.backgroundImage=`url('${A.hero||''}')`})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
