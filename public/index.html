<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section class="hero" style="background-image:url('/assets/2026/06/greg-marshall-aragon-worldsbk-2026-19.jpg')"><div class="inner"><h1>Greg<br>Marshall</h1><h2>2026 Yamaha R3 BLU CRU World Cup</h2><h2>AG Motorsport Italia</h2></div></section><section class="section"><div class="wrap"><h2>Latest News + Race Reports</h2><div id="news" class="grid"></div></div></section><section class="section"><div class="wrap"><h2>Thanks to my sponsors and suppliers</h2><div id="sponsors" class="sponsors"></div></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();let n=(d?.news||[]).slice(0,3);document.querySelector('#news').innerHTML=n.map(x=>`<article class="card"><div class="pad"><small>${x.date}</small><h3>${x.title}</h3><a class="accent" href="/news#${x.id}">READ MORE</a></div></article>`).join('');document.querySelector('#sponsors').innerHTML=(A.sponsors||[]).slice(0,6).map(x=>`<div class="sponsor"><img src="${x}"></div>`).join('')})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
