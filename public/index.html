<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section id="hero" class="hero" style="background-image:url('/assets/2026/06/greg-marshall-aragon-worldsbk-2026-19.jpg')"><div class="inner"><div id="eyebrow" class="eyebrow">#95 • Yamaha R3 BLU CRU World Cup</div><h1 id="headline">Greg<br>Marshall</h1><h2 id="subheadline">Racing Europe. Chasing every tenth.</h2></div></section><section class="section"><div class="wrap"><div id="introKicker" class="section-kicker">Latest from the paddock</div><h2 id="introTitle">Latest News + Race Reports</h2><p id="introText" class="muted"></p><div id="news" class="grid"></div></div></section><section class="section"><div class="wrap"><div class="section-kicker">Backed by</div><h2>Partners &amp; Sponsors</h2><div id="sponsors" class="sponsors"></div></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content(),h=d?.home||{};if(h.heroImage)hero.style.backgroundImage=`url('${h.heroImage}')`;eyebrow.textContent=h.eyebrow||'#95';headline.innerHTML=(h.headline||'GREG MARSHALL').replace(/\n/g,'<br>');subheadline.textContent=h.subheadline||'';introTitle.textContent=h.introTitle||'Latest News + Race Reports';introText.textContent=h.introText||'';let n=(d?.news||[]).slice(0,3);news.innerHTML=n.map(x=>`<article class="card">${x.image?`<img src="${x.image}" alt="">`:''}<div class="pad"><small>${x.date}</small><h3>${x.title}</h3><a class="accent" href="/news#${x.id}">READ MORE →</a></div></article>`).join('');let sc=d?.sponsors||{},tiles=(sc.tiles?.length?sc.tiles:(A.sponsors||[]).map(image=>({image,link:'',text:'',background:'white'})));let hc=Math.max(1,parseInt(sc.homeColumns)||3),hr=Math.max(1,parseInt(sc.homeRows)||2);sponsors.style.setProperty('--sponsor-cols',hc);sponsors.innerHTML=tiles.slice(0,hc*hr).map(sponsorTile).join('')})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
