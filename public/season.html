<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Season | Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section id="pageHero" class="page-hero"><div class="wrap"><div class="eyebrow">Greg Marshall Racing • #95</div><h1 id="seasonHeading">SEASON</h1></div></section><section class="section"><div class="wrap"><div id="yearTabs" class="year-tabs"></div><div id="cal" class="calendar"></div></div></section><div class="news-modal" id="eventModal" role="dialog" aria-modal="true" aria-label="Event details"><div class="news-modal-backdrop" onclick="closeEvent()"></div><div class="news-modal-box"><button class="news-modal-close" onclick="closeEvent()" aria-label="Close">×</button><div id="eventBody" class="news-modal-content"></div></div></div><div id="bottom"></div><script src="/app.js"></script><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let events=[],chosenYear='';function closeEvent(){eventModal.classList.remove('open');document.body.classList.remove('modal-open')}function showEvent(i){let e=events[i];if(!e)return;let links=[['Circuit',e.circuitUrl],['Organiser',e.organiserUrl],['Race report',e.reportUrl]].filter(x=>x[1]);eventBody.innerHTML=`<small>${esc(e.date)} • ${esc(e.location)}</small><h2>${esc(e.name)}</h2><div class="news-modal-body">${esc(e.description||'')}</div><div class="event-photos">${(e.photos||[]).map(p=>`<img loading="lazy" src="${esc(typeof p==='string'?p:p.url)}" alt="${esc(p.caption||'Event photograph')}">`).join('')}</div><div class="event-links">${links.map(([n,u])=>`<a class="btn" target="_blank" rel="noopener" href="${esc(u)}">${n}</a>`).join('')}</div>`;eventModal.classList.add('open');document.body.classList.add('modal-open')}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEvent()});function draw(){let yrs=[...new Set(events.map(x=>String(x.year||'2026')))].sort((a,b)=>Number(b)-Number(a));if(!yrs.length)yrs=['2026'];if(!yrs.includes(chosenYear))chosenYear=yrs[0];yearTabs.innerHTML=yrs.map(y=>`<button class="smallbtn ${chosenYear===y?'selected':''}" data-year="${esc(y)}">${esc(y)}</button>`).join('');yearTabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{chosenYear=b.dataset.year;draw()});cal.innerHTML=events.map((e,i)=>({...e,i})).filter(e=>String(e.year||'2026')===chosenYear).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)).map(e=>`<button class="row event-row" onclick="showEvent(${e.i})"><strong>${esc(e.name)}</strong><span>${esc(e.location)} · ${esc(e.date)}</span><span class="event-more">View details →</span></button>`).join('')||'<p>No events added for this season yet.</p>'}document.addEventListener('DOMContentLoaded',async()=>{let d=await content();events=d?.events||[];seasonHeading.textContent=(d?.seasonMenuLabel||'Season').toUpperCase();let img=d?.artwork?.calendar||A.hero||'';pageHero.style.backgroundImage=`url('${img.replace(/'/g,'%27')}')`;draw()});</script></body></html>
