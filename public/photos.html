<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section id="pageHero" class="page-hero"><div class="wrap"><div class="eyebrow">Greg Marshall Racing • #95</div><h1>PHOTO ALBUMS</h1></div></section><section class="section"><div class="wrap"><div id="albums"></div></div></section><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();let gallery=Array.isArray(d?.gallery)?d.gallery:(A.gallery||[]);document.querySelector('#albums').innerHTML=gallery.map(a=>`<section class="album"><h2>${a.title||''}</h2><div class="gallery">${(a.images||[]).map(i=>`<a href="${i}" target="_blank"><img loading="lazy" src="${i}"></a>`).join('')}</div></section>`).join('')})</script><script>document.addEventListener('DOMContentLoaded',async()=>{let d=await content();let img=d?.artwork?.photos;if(img){pageHero.style.backgroundImage=`url('${img}')`}else pageHero.style.backgroundImage=`url('${A.hero||''}')`})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
