<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greg Marshall Racing</title><link rel="stylesheet" href="/style.css"><script src="/site-data.js"></script></head><body><div id="top"></div><section class="section"><div class="wrap"><h1>Photo Albums</h1><div id="albums"></div></div></section><script>document.addEventListener('DOMContentLoaded',()=>{document.querySelector('#albums').innerHTML=(A.gallery||[]).map(a=>`<section class="album"><h2>${a.title}</h2><div class="gallery">${a.images.map(i=>`<a href="${i}" target="_blank"><img loading="lazy" src="${i}"></a>`).join('')}</div></section>`).join('')})</script><div id="bottom"></div><script src="/app.js"></script></body></html>
